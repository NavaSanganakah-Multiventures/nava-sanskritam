<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nava Sanskritam - Web Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; }
        #monaco-editor-container { width: 100%; height: 100%; }
    </style>
</head>
<body class="flex flex-col h-screen">
    
    <header class="bg-[#161b22] border-b border-gray-700 p-4 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center font-bold text-white">N</div>
            <h1 class="text-xl font-bold tracking-wide">Nava Sanskritam Playground <span class="text-xs text-orange-400 border border-orange-400/30 px-2 py-0.5 rounded-full ml-2">v18.0 WASM Preview</span></h1>
        </div>
        <button id="run-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-transform active:scale-95 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Run Native WASM
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Editor Left -->
        <div class="w-1/2 border-r border-gray-700 bg-[#0d1117] flex flex-col pt-2 relative">
            <div class="px-4 py-2 text-xs text-gray-400 font-mono tracking-widest uppercase mb-1">main.ns</div>
            <div class="flex-1" id="monaco-editor-container"></div>
        </div>

        <!-- Output Right -->
        <div class="w-1/2 flex flex-col bg-[#050505] relative">
            <div class="bg-[#161b22] px-4 py-3 border-b border-gray-800 flex justify-between">
                <p class="text-xs text-gray-400 font-mono uppercase tracking-widest">Compiler Output</p>
            </div>
            
            <div class="flex-1 p-6 overflow-y-auto">
                <div id="loading" class="hidden text-orange-400 animate-pulse text-sm font-mono mb-4">Compiling via NVC + LLVM to WebAssembly...</div>
                <div id="output-box" class="font-mono text-sm text-green-400 whitespace-pre-wrap">Awaiting compilation...</div>
                
                <hr class="border-gray-800 my-6">
                
                <p class="text-xs text-gray-500 font-mono mb-2">Darshanam Render:</p>
                <div id="sul-root" class="bg-white/5 border border-white/10 rounded-xl min-h-[200px] w-full p-4">
                    <!-- Dynamic Web UI renders here -->
                </div>
            </div>
        </div>
    </div>

    <script src="playground.js"></script>
</body>
</html>
