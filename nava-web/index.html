<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नव्या-क्रीडाङ्गणम् | Nava Web Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #f59e0b; --bg: #020617; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Outfit', sans-serif; }
        .sanskrit-font { font-family: 'Martel', serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        #editor-container { height: calc(100vh - 200px); border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <!-- HEADER -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center text-3xl shadow-2xl shadow-amber-500/40 font-bold text-black transform -rotate-3 select-none">न</div>
                <div>
                    <h1 class="text-3xl font-black sanskrit-font tracking-tighter text-white">नव्या-क्रीडाङ्गणम्</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <p class="text-slate-400 text-xs font-medium uppercase tracking-widest">Nava Engine v2.5 Online</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="docs.html" class="px-6 py-3 glass rounded-full font-bold text-slate-300 hover:text-white transition-all flex items-center gap-2 border border-white/10 hover:border-amber-500/50">
                    <span>📖</span> मार्गदर्शिका
                </a>
                <button id="run-btn" class="group relative px-10 py-3 bg-amber-500 hover:bg-amber-400 text-black rounded-full font-black text-lg transition-all transform hover:-translate-y-1 active:scale-95 shadow-2xl shadow-amber-500/30 overflow-hidden">
                    <span class="relative z-10">चलाओ (RUN)</span>
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                </button>
            </div>
        </header>

        <!-- MAIN GRID -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- EDITOR -->
            <div class="glass p-1 rounded-2xl">
                <div id="monaco-editor-container" style="height: calc(100vh - 250px);"></div>
            </div>

            <!-- OUTPUT & DARSHANAM -->
            <div class="flex flex-col gap-6">
                <!-- CONSOLE OUTPUT -->
                <div class="glass p-6 rounded-2xl min-h-[150px]">
                    <h2 class="text-amber-500 font-bold mb-4 flex items-center gap-2">
                        <span>🚩</span> निर्गम-पटलम् (OUTPUT)
                    </h2>
                    <div id="loading" class="hidden text-slate-400 text-sm mb-2 animate-pulse">सङ्कलनं भवति...</div>
                    <pre id="output-box" class="font-mono text-emerald-400 whitespace-pre-wrap">🚩 नव्या-सङ्कलकस्य प्रतीक्षायाम्...</pre>
                </div>

                <!-- LIVE UI (DARSHANAM) -->
                <div class="glass p-6 rounded-2xl flex-1 min-h-[300px]">
                    <h2 class="text-blue-400 font-bold mb-4 flex items-center gap-2">
                        <span>🎨</span> साक्षात्-दर्शनम् (LIVE UI)
                    </h2>
                    <div id="sul-root" class="bg-black/30 rounded-xl p-4 min-h-[200px] border border-white/5"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs/loader.min.js"></script>
    <script src="nvc.js"></script>
    <script src="playground.js"></script>
</body>
</html>
