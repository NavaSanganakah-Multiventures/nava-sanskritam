name: Release NVC & Nava Studio

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-nvc:
    name: Build NVC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: nvc-linux-x64
            exe_name: nvc
          - os: windows-latest
            asset_name: nvc-windows-x64
            exe_name: nvc.exe
          - os: macos-latest
            asset_name: nvc-macos-x64
            exe_name: nvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang libffi-dev libtinfo-dev libzstd-dev cmake ninja-build

      - name: Setup LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@18 cmake ninja
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH

      - name: Setup LLVM (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            zip
          update: true

      - name: Configure & Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S nvc -B nvc/build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build nvc/build

      - name: Configure & Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cd nvc && mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja

      - name: Package binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/${{ matrix.asset_name }}
          cp nvc/build/${{ matrix.exe_name }} dist/${{ matrix.asset_name }}/
          chmod +x dist/${{ matrix.asset_name }}/${{ matrix.exe_name }}
          cd dist && tar -czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          mkdir -p dist/${{ matrix.asset_name }}
          cp nvc/build/${{ matrix.exe_name }} dist/${{ matrix.asset_name }}/
          ldd nvc/build/${{ matrix.exe_name }} | grep '/mingw64/bin/' | awk '{ print $3 }' | xargs -I '{}' cp '{}' dist/${{ matrix.asset_name }}/
          cd dist && zip -r ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

      - name: Upload NVC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.*
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: build-nvc
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
      tag_name: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download NVC artifacts
        uses: actions/download-artifact@v4
        with:
          path: nvc-artifacts
          merge-multiple: true

      - name: Create Draft Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: nvc-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

  build-desktop:
    name: Build Nava Studio (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nvc_asset: nvc-windows-x64.zip
            installer_glob: "nava-studio/dist/*.exe"
          - os: macos-latest
            nvc_asset: nvc-macos-x64.tar.gz
            installer_glob: "nava-studio/dist/*.dmg"
          - os: ubuntu-latest
            nvc_asset: nvc-linux-x64.tar.gz
            installer_glob: "nava-studio/dist/*.AppImage"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download NVC binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p nava-studio/bin
          cd nava-studio/bin
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "${{ matrix.nvc_asset }}"
          if [[ "${{ matrix.nvc_asset }}" == *.zip ]]; then
            unzip -o "${{ matrix.nvc_asset }}"
            mv nvc-windows-x64/* .
          elif [[ "${{ matrix.nvc_asset }}" == *.tar.gz ]]; then
            tar -xzf "${{ matrix.nvc_asset }}"
            mv nvc-*-x64/* .
          fi
          rm -f "${{ matrix.nvc_asset }}"
          chmod +x nvc || true
        shell: bash

      - name: Install dependencies
        run: |
          cd nava-studio
          npm install

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd nava-studio
          npm run build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.installer_glob }}
          retention-days: 5

  publish-desktop-assets:
    name: Attach Desktop Installers to Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-artifacts/*
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          append_body: true
          body: |
            ## Nava Studio Desktop Installers
