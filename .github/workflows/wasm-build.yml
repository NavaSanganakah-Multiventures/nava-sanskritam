name: Build NVC WASM

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Verify Emscripten
        run: emcc -v

      - name: Configure CMake (WASM)
        run: |
          mkdir build-wasm
          cd build-wasm
          emcmake cmake .. -DEMSCRIPTEN=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: |
          cd build-wasm
          emmake make

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvc-wasm-bundle
          path: |
            build-wasm/nvc.wasm
            build-wasm/nvc.js
            build-wasm/nvc.wasm.js
