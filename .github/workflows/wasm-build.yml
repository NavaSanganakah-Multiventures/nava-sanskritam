name: Build NVC WASM

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Verify Emscripten
        run: emcc -v

      - name: Configure CMake (WASM)
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake ../nvc -DEMSCRIPTEN=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: |
          # The source nava-web/ contains frontend files (index.html, playground.js)
          # We build and copy nvc.js/wasm into it
          cd build-wasm
          emmake make -j4
          cp nvc.js ../nava-web/nvc.js
          cp nvc.wasm ../nava-web/nvc.wasm

      - name: Upload NVC Web Playground Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvc-web-playground
          path: nava-web/
