name: Build NVC WASM

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Verify Emscripten
        run: emcc -v

      - name: Configure CMake (WASM)
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake ../nvc -DEMSCRIPTEN=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: |
          # The source nava-web/ contains frontend files (index.html, playground.js)
          # We build and copy nvc.js/wasm into it
          cd build-wasm
          emmake make -j4
          cp nvc.js ../nava-web/nvc.js
          cp nvc.wasm ../nava-web/nvc.wasm

      - name: Deploy WASM to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nava-web/nvc.js nava-web/nvc.wasm
          # Only commit if there are changes to avoid empty commits
          if [ -n "$(git status --porcelain nava-web/)" ]; then
            git commit -m "build: update WASM binaries for playground [skip ci]"
            git push
          else
            echo "No changes in WASM binaries, skipping push."
          fi
