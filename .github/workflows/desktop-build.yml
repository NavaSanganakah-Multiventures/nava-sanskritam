name: Build Nava Studio (Desktop Installer)

on:
  push:
    branches: [ "nava-framework-vsc-extension-9061376043773154792" ]
  pull_request:
    branches: [ "nava-framework-vsc-extension-9061376043773154792" ]

jobs:
  build-nvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2 and LLVM
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
        update: true
        
    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cd nvc
        mkdir build
        cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
        
    - name: Build NVC
      shell: msys2 {0}
      run: |
        cd nvc/build
        ninja
        
    - name: Upload NVC Binary
      uses: actions/upload-artifact@v4
      with:
        name: nvc-binary
        path: nvc/build/nvc.exe

  package-electron:
    needs: build-nvc
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        
    - name: Download NVC Binary
      uses: actions/download-artifact@v4
      with:
        name: nvc-binary
        path: nava-studio/bin/
        
    - name: Install Dependencies
      run: |
        cd nava-studio
        npm install
        
    - name: Build Installer
      run: |
        cd nava-studio
        npm run build
        
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: nava-studio-installer
        path: nava-studio/dist/*.exe

