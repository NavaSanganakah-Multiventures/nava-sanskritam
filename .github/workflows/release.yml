name: Nava Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-15 llvm-15-dev clang-15 libzstd-dev dpkg-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja llvm@15 create-dmg

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja llvm --version=15.0.7

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Binary (Linux/Windows)
        if: runner.os != 'macOS'
        run: |
          mkdir build && cd build
          cmake -G Ninja ../nvc
          ninja

      - name: Build Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir build && cd build
          cmake -G Ninja -DLLVM_DIR=$(brew --prefix llvm@15)/lib/cmake/llvm ../nvc
          ninja

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          mkdir -p nvc-pkg/usr/local/bin
          cp nvc nvc-pkg/usr/local/bin/
          mkdir -p nvc-pkg/DEBIAN
          cat << 'CONTROL' > nvc-pkg/DEBIAN/control
          Package: nava-compiler
          Version: 1.0.0
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Nava Sanskritam
          Description: Nava Sanskritam Compiler
          CONTROL
          dpkg-deb --build nvc-pkg nvc.deb

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build
          mkdir nvc-mac
          cp nvc nvc-mac/
          create-dmg \
            --volname "Nava Compiler" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "nvc" 200 190 \
            --hide-extension "nvc" \
            "nvc.dmg" \
            "nvc-mac/"

      - name: Prepare Windows Executable
        if: runner.os == 'Windows'
        run: |
          # Ninja on Windows creates nvc.exe directly, no rename needed.

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvc-binary-${{ matrix.os }}
          path: |
            build/nvc.deb
            build/nvc.dmg
            build/nvc.exe

  release:
    name: Create GitHub Release
    needs: [build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/nvc-binary-ubuntu-latest/nvc.deb
            artifacts/nvc-binary-macos-latest/nvc.dmg
            artifacts/nvc-binary-windows-latest/nvc.exe
