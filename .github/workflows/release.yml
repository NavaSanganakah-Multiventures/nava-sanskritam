name: Nava Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-15 llvm-15-dev clang-15 libzstd-dev dpkg-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja llvm@15 create-dmg

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja llvm --version=15.0.7

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Binary (Linux/Windows)
        if: runner.os != 'macOS'
        run: |
          mkdir build && cd build
          cmake -G Ninja ../nvc
          ninja

      - name: Build Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir build && cd build
          cmake -G Ninja -DLLVM_DIR=$(brew --prefix llvm@15)/lib/cmake/llvm ../nvc
          ninja

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          mkdir -p nvc-pkg/usr/local/bin
          cp nvc nvc-pkg/usr/local/bin/
          mkdir -p nvc-pkg/DEBIAN
          cat << 'CONTROL' > nvc-pkg/DEBIAN/control
          Package: nava-compiler
          Version: 1.0.0
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Nava Sanskritam
          Description: Nava Sanskritam Compiler
          CONTROL
          dpkg-deb --build nvc-pkg nvc.deb

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build
          mkdir nvc-mac
          cp nvc nvc-mac/
          create-dmg --volname "Nava Compiler" --window-pos 200 120 --window-size 800 400 --icon-size 100 --icon "nvc" 200 190 --hide-extension "nvc" --app-drop-link 600 185 "nvc.dmg" "nvc-mac/"

      - name: Prepare Windows Executable
        if: runner.os == 'Windows'
        run: |
          # Ninja on Windows creates nvc.exe directly, no rename needed.

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvc-binary-${{ matrix.os }}
          path: |
            build/nvc.deb
            build/nvc.dmg
            build/nvc.exe

  build-web:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v12

      - name: Build WASM
        run: |
          mkdir build-wasm && cd build-wasm
          emcmake cmake ../nvc
          make

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts/nvc-wasm
          path: build-wasm/libnava_core.a

  build-mobile:
    name: Build Mobile (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [android, ios]

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install ninja cmake

      - name: Setup Android NDK
        if: matrix.target == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build for Android
        if: matrix.target == 'android'
        run: |
          mkdir build-android && cd build-android
          cmake -G Ninja ../nvc \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21
          ninja nava_core
          cp libnava_core.a ../nava_core_android.a

      - name: Build for iOS
        if: matrix.target == 'ios'
        run: |
          mkdir build-ios && cd build-ios
          cmake -G Xcode ../nvc \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build . --config Release --target nava_core
          cp Release-iphoneos/libnava_core.a ../nava_core_ios.a

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvc-${{ matrix.target }}
          path: |
            nava_core_android.a
            nava_core_ios.a

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-web, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/nvc-binary-ubuntu-latest/nvc.deb
            artifacts/nvc-binary-macos-latest/nvc.dmg
            artifacts/nvc-binary-windows-latest/nvc.exe
            artifacts/nvc-wasm/libnava_core.a
            artifacts/nvc-android/nava_core_android.a
            artifacts/nvc-ios/nava_core_ios.a
