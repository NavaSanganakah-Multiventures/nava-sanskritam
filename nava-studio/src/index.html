<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nava Studio - v18.0</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--bg-card);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .toolbar {
      display: flex;
      gap: 10px;
    }
    button {
      background-color: var(--accent);
      color: var(--bg-dark);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    #editor-container {
      flex: 2;
      border-right: 1px solid var(--border);
    }
    #output-container {
      flex: 1;
      background-color: #000;
      padding: 15px;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      color: #10b981;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .status-bar {
      background-color: var(--bg-card);
      padding: 4px 20px;
      font-size: 11px;
      color: #94a3b8;
      border-top: 1px solid var(--border);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <header>
      <div class="logo">🚩 Nava Studio</div>
      <div class="toolbar">
        <button id="run-btn">▶ Run (लट्-क्रिया)</button>
        <button style="background: #e11d48; color: white;">Save (संग्रह)</button>
      </div>
    </header>
    <main>
      <div id="editor-container"></div>
      <div id="output-container">Welcome to Nava Studio v18.0...
Ready to compile Sanskrit logic.</div>
    </main>
    <div class="status-bar">
      Compiler Environment: Connected | Branch: nava-framework-vsc-extension
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs/loader.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
